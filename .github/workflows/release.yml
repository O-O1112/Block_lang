name: Publish Block Engine release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        default: v2.2.2
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify release artifacts
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          .\build-release.ps1 -Version $version -ReleaseDirectory (Join-Path $PWD 'release')

      - name: Run complete release test suite
        shell: powershell
        run: |
          .\tests\Test-BlockEngine.ps1 -EngineDirectory (Join-Path $PWD 'release')
          .\tests\Test-BlockCli.ps1 -EngineDirectory (Join-Path $PWD 'release')
          .\tests\Test-NativeLanguage.ps1 -EngineDirectory (Join-Path $PWD 'release')
          .\tests\Test-NativeInterpreter.ps1 -SourcePath (Join-Path $PWD 'src\NativeBlockProgram.cs')

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $repo = $env:GITHUB_REPOSITORY
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'release') -File | ForEach-Object FullName)

          if ($assets.Count -eq 0) {
            throw 'No release assets were produced.'
          }

          # Keep the workflow idempotent. GitHub CLI reports a missing release
          # on stderr; do not let that expected lookup miss terminate the job.
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $repo 2>$null
          $viewExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          if ($viewExitCode -eq 0) {
            gh release upload $tag @assets --repo $repo --clobber
          } else {
            gh release create $tag @assets --repo $repo --title "Block Engine $tag" --generate-notes
          }
