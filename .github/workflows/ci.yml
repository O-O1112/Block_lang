name: Build and test Block Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: block-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build release artifacts
        shell: powershell
        run: .\build-release.ps1 -ReleaseDirectory (Join-Path $PWD 'ci-release')

      - name: Run engine smoke tests
        shell: powershell
        run: .\tests\Test-BlockEngine.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Run CLI tests
        shell: powershell
        run: .\tests\Test-BlockCli.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Verify actionable error diagnostics
        shell: powershell
        run: .\tests\Test-ActionableErrors.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Verify third-party package removal
        shell: powershell
        run: .\tests\Test-NoThirdPartyPackages.ps1 -EngineDirectory (Join-Path $PWD 'ci-release') -RepositoryRoot $PWD

      - name: Run path resolution tests
        shell: powershell
        run: .\tests\Test-BlockPaths.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Verify installer TLS transport
        shell: powershell
        run: .\tests\Test-InstallerTransport.ps1 -RepositoryRoot $PWD

      - name: Verify Block AI knowledge corpus
        shell: powershell
        run: .\tests\Test-BlockAiCorpus.ps1 -RepositoryRoot $PWD

      - name: Run native language tests
        shell: powershell
        run: .\tests\Test-NativeLanguage.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Run native interpreter tests
        shell: powershell
        run: .\tests\Test-NativeInterpreter.ps1 -SourcePath (Join-Path $PWD 'src\NativeBlockProgram.cs')

      - name: Run health-hardening regression tests
        shell: powershell
        run: .\tests\Test-HealthHardening.ps1 -EngineDirectory (Join-Path $PWD 'ci-release') -RepositoryRoot $PWD

      - name: Verify custom runtime policy
        shell: powershell
        run: .\tests\Test-CustomRuntimePolicy.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Run API server integration tests
        shell: powershell
        run: .\tests\Test-ApiServer.ps1 -EngineDirectory (Join-Path $PWD 'ci-release')

      - name: Run Community Lab harness
        shell: powershell
        run: .\tests\Test-CommunityLab.ps1 -EngineDirectory (Join-Path $PWD 'ci-release') -SkipPolyglot

      - name: Verify release version injection
        shell: powershell
        run: .\tests\Test-ReleaseVersioning.ps1 -RepositoryRoot $PWD

      - name: Verify version consistency
        shell: powershell
        run: .\tests\Test-VersionConsistency.ps1 -RepositoryRoot $PWD

      - name: Verify repository integrity
        shell: powershell
        run: .\tests\Test-RepositoryIntegrity.ps1 -RepositoryRoot $PWD

      - name: Upload release verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: block-engine-release-${{ github.sha }}
          path: ci-release
          if-no-files-found: error
